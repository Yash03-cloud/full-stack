<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Timetable</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="p-3 bg-light">

    <div class="container" style="max-width: 200px; border: 2px solid black;">
        <h4 class="text-center my-3">Class Timetable</h4>
        <table class="table table-sm table-bordered table-striped text-center align-middle small">
            <thead class="table-dark">
                <tr>
                    <th>Time</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="fw-bold bg-secondary text-white">9 AM</td>
                    <td>Math</td>
                    <td>Eng</td>
                    <td>Math</td>
                    <td>Hist</td>
                    <td>Geo</td>
                </tr>
                <tr>
                    <td class="fw-bold bg-secondary text-white">10 AM</td>
                    <td>Phys</td>
                    <td>Chem</td>
                    <td>Bio</td>
                    <td>Phys</td>
                    <td>Chem</td>
                </tr>
                <tr class="table-warning fw-bold">
                    <td>11 AM</td>
                    <td colspan="5">BREAK</td>
                </tr>
                <tr>
                    <td class="fw-bold bg-secondary text-white">12 PM</td>
                    <td>Comp</td>
                    <td>Hist</td>
                    <td>Comp</td>
                    <td>Eng</td>
                    <td>Bio</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
