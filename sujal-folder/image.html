<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Photo Gallery</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container text-center" style="max-width: 700px;">
        <h2 class="mb-4">Mini Photo Gallery</h2>
        <div class="row g-3">
            <div class="col-md-6">
                <img src="./mountain.jpg" class="img-fluid rounded shadow-sm" alt="Mountain">
                <p class="mt-2 text-muted">Misty Mountain Sunrise</p>
            </div>
            <div class="col-md-6">
                <img src="./ocean.jpg" class="img-fluid rounded shadow-sm" alt="Ocean">
                <p class="mt-2 text-muted">Serene Ocean Waves</p>
            </div>
            <div class="col-md-6">
                <img src="./wood.jpg" class="img-fluid rounded shadow-sm" alt="Forest">
                <p class="mt-2 text-muted">Path Through the Woods</p>
            </div>
            <div class="col-md-6">
                <img src="./city light.jpg" class="img-fluid rounded shadow-sm" alt="City">
                <p class="mt-2 text-muted">City Lights at Dusk</p>
            </div>
        </div>
    </div>

</body>
</html>
