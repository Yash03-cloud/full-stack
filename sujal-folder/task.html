    <form action="">
    <h2>Course Enrollment Form</h2>
    <form>
        <label for="name">Student Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="course">Course Selection:</label><br>
        <select id="course" name="course" required>
            <option value="">Select a Course</option>
            <option value="python">Python Programming</option>
            <option value="java">Java Development</option>
            <option value="web">Web Development</option>
            <option value="data">Data Science</option>
        </select><br><br>

        <button type="submit">Submit</button>

    </form>
    <form action="">
        
    <h2>Online Survey Form</h2>
     
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label>Hobbies:</label><br>
        <input type="checkbox" id="reading" name="hobbies" value="reading">
        <label for="reading">Reading</label><br>
        <input type="checkbox" id="sports" name="hobbies" value="sports">
        <label for="sports">Sports</label><br>
        <input type="checkbox" id="music" name="hobbies" value="music">
        <label for="music">Music</label><br>
        <input type="checkbox" id="traveling" name="hobbies" value="traveling">
        <label for="traveling">Traveling</label><br><br>
        <label for="favcolor">Favorite Color:</label><br>
        <input type="color" id="favcolor" name="favcolor" value="#ff0000"><br><br>
        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
