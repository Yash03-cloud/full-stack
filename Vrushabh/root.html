<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --one: red;
            --two:black;
            --three:2%;
        }
        h1{
            color: var(--one);
        }
        h2{
            color: var(--two);
            padding: var(--three);
            background-color: var(--one);
        }
    </style>
</head>
<body>
    <h1>hello</h1>
    <h2>blue</h2>
</body>
</html>
